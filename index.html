<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)} [hidden]{display:none!important} img{max-width:100%}</style>
<title>부산대성 예산실적 관리</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 상단 고정 탭 + 화면별 작업 영역. 실적표는 기존 양식의 녹색 합계행, 입력칸은 엑셀처럼 노랑/회색 구분 */
:root {
  --bg: #F4F6F9; --surface: #FFFFFF; --surface2: #EEF1F5; --fg: #18202D; --muted: #5B6577; --line: #D6DBE3; --line-strong: #1F3864;
  --navy: #1F3864; --navy2: #2E5597; --navy3: #8FAADC; --accent: #C00000; --on-navy: #FFFFFF;
  --s1: #2E5597; --s2: #8FAADC; --s3: #8A8F98; --fav: #2E5597; --unfav: #C00000;
  --tot: #DCEFC9; --tot-fg: #1E3A10; --sub: #EAF0F8; --sil-h: #92D050; --sil-h-fg: #10230A;
  --in: #FFF6D5; --in-fg: #3D3100; --auto: #EEF1F5;
  --rev: #DDEBF7; --rev-fg: #1F4E79; --fix: #E2EFDA; --fix-fg: #375623; --var: #FCE4D6; --var-fg: #843C0C;
  --adj: #EDEDED; --adj-fg: #3A3A3A; --err: #F8CBAD; --err-fg: #9C0006; --warn: #FFE8B0; --warn-fg: #6B4A00;
  --ok: #DCEFC9; --ok-fg: #1E4D12; --focus: #2E5597; --shadow: 0 1px 2px rgba(20,30,50,.08); --th-bg: #1F3864; --th-fg: #FFFFFF; --seg-fg: #FFFFFF;
  --font: "Noto Sans KR", "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F141B; --surface: #161D27; --surface2: #1D2632; --fg: #E4E8EE; --muted: #98A2B3; --line: #2A3443; --line-strong: #8FAADC;
  --navy: #A9C0E6; --navy2: #8FAADC; --navy3: #4D6FA6; --accent: #FF7070; --on-navy: #0F141B;
  --s1: #8FAADC; --s2: #4D6FA6; --s3: #8C939D; --fav: #8FAADC; --unfav: #FF7070;
  --tot: #24391B; --tot-fg: #CFE8B8; --sub: #1C2736; --sil-h: #3E6B24; --sil-h-fg: #EAF6DF;
  --in: #38301A; --in-fg: #F3E2A6; --auto: #1D2632;
  --rev: #1C3450; --rev-fg: #BCD8F3; --fix: #213720; --fix-fg: #C2E2B1; --var: #452A1B; --var-fg: #F6C9A9;
  --adj: #2D2F33; --adj-fg: #D5D7DB; --err: #4C1F22; --err-fg: #FFB4B4; --warn: #43361A; --warn-fg: #F5D995;
  --ok: #24391B; --ok-fg: #CFE8B8; --focus: #8FAADC; --shadow: none; --th-bg: #2A4675; --th-fg: #FFFFFF; --seg-fg: #0F141B; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F141B; --surface: #161D27; --surface2: #1D2632; --fg: #E4E8EE; --muted: #98A2B3; --line: #2A3443; --line-strong: #8FAADC;
  --navy: #A9C0E6; --navy2: #8FAADC; --navy3: #4D6FA6; --accent: #FF7070; --on-navy: #0F141B;
  --s1: #8FAADC; --s2: #4D6FA6; --s3: #8C939D; --fav: #8FAADC; --unfav: #FF7070;
  --tot: #24391B; --tot-fg: #CFE8B8; --sub: #1C2736; --sil-h: #3E6B24; --sil-h-fg: #EAF6DF;
  --in: #38301A; --in-fg: #F3E2A6; --auto: #1D2632;
  --rev: #1C3450; --rev-fg: #BCD8F3; --fix: #213720; --fix-fg: #C2E2B1; --var: #452A1B; --var-fg: #F6C9A9;
  --adj: #2D2F33; --adj-fg: #D5D7DB; --err: #4C1F22; --err-fg: #FFB4B4; --warn: #43361A; --warn-fg: #F5D995;
  --ok: #24391B; --ok-fg: #CFE8B8; --focus: #8FAADC; --shadow: none; --th-bg: #2A4675; --th-fg: #FFFFFF; --seg-fg: #0F141B; color-scheme: dark }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 14px; line-height: 1.55; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in, .main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding-block: 10px 0; }
.brand { display: grid; line-height: 1.2; padding-bottom: 8px; }
.brand b { color: var(--navy); font-size: 15px; }
.brand span { color: var(--muted); font-size: 12px; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; flex: 1 1 auto; min-width: 0; scrollbar-width: thin; }
nav.tabs a { white-space: nowrap; padding: 8px 12px 10px; color: var(--muted); text-decoration: none; font-weight: 500; border-bottom: 3px solid transparent; }
nav.tabs a:hover { color: var(--fg); }
nav.tabs a[aria-current="page"] { color: var(--navy); border-bottom-color: var(--navy2); font-weight: 700; }
.tools { display: flex; align-items: center; gap: 10px; padding-bottom: 8px; font-size: 12px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 99px; background: var(--surface2); font-size: 12px; white-space: nowrap; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--s3); display: inline-block; }
.pill.on i { background: #3A9A4A; } .pill.wait i { background: #D99A1E; } .pill.off i { background: var(--accent); }
.main { max-width: 1320px; margin: 0 auto; padding-block: 18px 60px; }
.view { display: flex; flex-direction: column; gap: 18px; }
.vhead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
h2 { font-size: 20px; color: var(--navy); }
h3 { font-size: 15px; color: var(--fg); }
.sub-t { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.panel { background: var(--surface); border: 1px solid var(--line); padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; box-shadow: var(--shadow); }
.panel-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px 12px; }
.cap { font-size: 13px; font-weight: 700; }
.src { font-size: 11.5px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
select, input[type="text"], input[type="search"], input[type="number"], textarea { font: inherit; font-size: 13px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; min-width: 0; }
textarea { width: 100%; min-height: 110px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
button { font: inherit; cursor: pointer; }
.btn { font-size: 13px; padding: 6px 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 3px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--navy2); color: var(--navy2); }
.btn.pri { background: var(--navy2); border-color: var(--navy2); color: var(--on-navy); font-weight: 700; }
.btn.pri:hover:not(:disabled) { filter: brightness(1.08); color: var(--on-navy); }
.btn.warn { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.sm { font-size: 12px; padding: 3px 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); color: var(--muted); padding: 6px 12px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--navy2); color: var(--on-navy); font-weight: 700; }
.note { font-size: 12.5px; color: var(--muted); }
.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 14px; background: var(--warn); color: var(--warn-fg); font-size: 13px; border: 1px solid var(--line); }
.banner.info { background: var(--sub); color: var(--fg); }
.banner.bad { background: var(--err); color: var(--err-fg); }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 640px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border: 1px solid var(--line); padding: 12px 14px; display: grid; gap: 3px; align-content: start; min-width: 0; box-shadow: var(--shadow); }
.kpi .k { font-size: 12px; color: var(--muted); }
.kpi .v { font-size: 22px; font-weight: 700; color: var(--fg); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.kpi .d { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.kpi .bar2 { height: 6px; background: var(--surface2); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.kpi .bar2 i { display: block; height: 100%; background: var(--s1); }
.kpi .bar2 i.over { background: var(--unfav); }

/* tables */
.tbl { overflow: auto; border: 1px solid var(--line); background: var(--surface); }
.tbl.tall { max-height: 70vh; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th { background: var(--th-bg); color: var(--th-fg); font-weight: 700; padding: 7px 8px; text-align: center; white-space: nowrap; position: sticky; top: 0; z-index: 2; }
td { padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td.num, th.num { text-align: right; }
td.wrap { white-space: normal; min-width: 180px; }
tbody tr:hover td { background-color: color-mix(in srgb, var(--navy3) 10%, transparent); }
.neg { color: var(--accent); }
.muted { color: var(--muted); }
table.sil th { background: var(--sil-h); color: var(--sil-h-fg); border-bottom: 2px solid var(--line-strong); }
table.sil td.lb { position: sticky; left: 0; background: var(--surface); z-index: 1; }
table.sil tr.total td { background: var(--tot); color: var(--tot-fg); font-weight: 700; }
table.sil tr.subt td { background: var(--sub); font-weight: 700; }
table.sil tr.ratio td { color: var(--muted); font-style: normal; }
table.sil tr.leaf td.lb { cursor: pointer; }
table.sil tr.leaf td.lb:hover { text-decoration: underline; }
table.sil tr.sel td { outline: 2px solid var(--navy2); outline-offset: -2px; }
.ind1 { padding-left: 20px !important; } .ind2 { padding-left: 34px !important; } .ind3 { padding-left: 50px !important; }

/* 입력 그리드 */
table.grid td { padding: 3px 4px; }
table.grid input, table.grid select { width: 100%; border-color: transparent; background: var(--in); color: var(--in-fg); padding: 5px 6px; }
table.grid input:focus, table.grid select:focus { border-color: var(--navy2); }
table.grid input.num { text-align: right; min-width: 90px; }
table.grid td.auto { background: var(--auto); }
table.grid input:disabled, table.grid select:disabled { background: transparent; color: var(--fg); }
.w-acct { min-width: 140px; } .w-memo { min-width: 200px; } .w-basis { min-width: 170px; } .w-item { min-width: 120px; }

.chip { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 7px; border-radius: 3px; white-space: nowrap; }
.g-매출 { background: var(--rev); color: var(--rev-fg); }
.g-고정비 { background: var(--fix); color: var(--fix-fg); }
.g-변동비 { background: var(--var); color: var(--var-fg); }
.g-이익조정 { background: var(--adj); color: var(--adj-fg); }
.g-미분류, .g-제외 { background: var(--err); color: var(--err-fg); }
.f-bad { background: var(--err); color: var(--err-fg); }
.f-info { background: var(--rev); color: var(--rev-fg); }
.f-warn { background: var(--warn); color: var(--warn-fg); }
.f-ok { background: var(--ok); color: var(--ok-fg); }

.sumrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.sum { background: var(--surface); border: 1px solid var(--line); padding: 8px 12px; display: grid; gap: 1px; }
.sum span { font-size: 11.5px; color: var(--muted); }
.sum b { font-size: 16px; font-variant-numeric: tabular-nums; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toolbar .sp { flex: 1 1 auto; }

/* charts */
.chart { position: relative; min-width: 0; }
.chart svg { display: block; max-width: 100%; height: auto; }
.chart text { fill: var(--muted); font-family: var(--font); font-size: 11px; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .zl { stroke: var(--muted); stroke-width: 1; }
.chart .b1 { fill: var(--s1); } .chart .b2 { fill: var(--s2); } .chart .b3 { fill: var(--s3); }
.chart .l1 { stroke: var(--s1); fill: none; stroke-width: 2; } .chart .l2 { stroke: var(--s2); fill: none; stroke-width: 2; } .chart .l3 { stroke: var(--s3); fill: none; stroke-width: 2; stroke-dasharray: 5 4; }
.chart .p1 { fill: var(--s1); stroke: var(--surface); stroke-width: 2; } .chart .p2 { fill: var(--s2); stroke: var(--surface); stroke-width: 2; } .chart .p3 { fill: var(--surface); stroke: var(--s3); stroke-width: 2; }
.chart .fav { fill: var(--fav); } .chart .unfav { fill: var(--unfav); }
.chart .hit { fill: transparent; }
.chart .hit:hover { fill: color-mix(in srgb, var(--navy3) 14%, transparent); }
.chart .vl { fill: var(--fg); font-size: 11px; }
.chart .seglb { fill: var(--seg-fg); font-size: 11px; font-weight: 700; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; display: inline-block; border-radius: 2px; }
.legend i.ln { height: 0; border-top: 2px solid; width: 16px; border-radius: 0; }
.legend i.dash { border-top-style: dashed; }
.tip { position: fixed; z-index: 50; background: var(--surface); color: var(--fg); border: 1px solid var(--line); box-shadow: 0 4px 14px rgba(0,0,0,.16); padding: 8px 10px; font-size: 12px; pointer-events: none; min-width: 150px; }
.tip b { display: block; margin-bottom: 4px; }
.tip div { display: flex; justify-content: space-between; gap: 14px; font-variant-numeric: tabular-nums; }

/* AI */
.ai-out { font-size: 13.5px; line-height: 1.7; max-width: 92ch; }
.ai-out p { margin: 0 0 4px; }
.ai-out p.top { font-weight: 700; color: var(--navy); margin-top: 14px; font-size: 14.5px; }
.ai-out p.l2 { padding-left: 1em; } .ai-out p.l3 { padding-left: 2.2em; color: var(--fg); }
.ai-out h4 { margin: 14px 0 6px; color: var(--navy); }
.ai-out table { margin: 6px 0 10px; width: auto; min-width: 60%; }
.ai-out td { white-space: normal; }
.thinking { color: var(--muted); font-size: 13px; }
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { padding: 10px 12px; border: 1px solid var(--line); max-width: 92ch; }
.msg.me { background: var(--sub); align-self: flex-end; }
.msg.ai { background: var(--surface); }
.row-in { display: flex; gap: 8px; }
.row-in input { flex: 1 1 auto; }
.list { display: grid; gap: 6px; }
.list button { text-align: left; border: 1px solid var(--line); background: var(--surface); padding: 8px 10px; color: var(--fg); }
.list button:hover { border-color: var(--navy2); }
.empty { padding: 26px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); background: var(--surface); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 9px 16px; border-radius: 4px; font-size: 13px; z-index: 60; max-width: calc(100% - 32px); }
.sr { position: absolute; left: -9999px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="pages-adapter.js"></script>
</head>
<body>
<header class="bar"><div class="bar-in">
  <div class="brand"><b>부산대성기숙학원</b><span>예산실적 관리</span></div>
  <nav class="tabs" id="tabs" aria-label="화면">
    <a href="#dashboard">대시보드</a><a href="#budget">예산 입력</a><a href="#actual">실적 입력</a>
    <a href="#report">실적표</a><a href="#analysis">분석</a><a href="#ai">AI 분석</a><a href="#rules">기준정보</a>
  </nav>
  <div class="tools">
    <label for="unit">금액 단위</label>
    <select id="unit"><option value="1">원</option><option value="1000">천원</option><option value="1000000" selected>백만원</option></select>
    <span class="pill wait" id="conn"><i></i><span>연결 중</span></span>
  </div>
</div></header>

<main class="main">
  <div id="demoBar" class="banner info" hidden></div>
  <section class="view" id="view-dashboard" hidden></section>
  <section class="view" id="view-budget" hidden></section>
  <section class="view" id="view-actual" hidden></section>
  <section class="view" id="view-report" hidden></section>
  <section class="view" id="view-analysis" hidden></section>
  <section class="view" id="view-ai" hidden></section>
  <section class="view" id="view-rules" hidden></section>
</main>
<div class="tip" id="tip" hidden></div>
<div class="toast" id="toast" hidden></div>
<div id="dls"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/*ENGINE-START*/

function prepCfg(c) {
  const cfg = { acct: c.acct || [], rules: c.rules || [], std: c.std || [], thr: Object.assign({ amt: 500000, rate: 0.1 }, c.thr || {}), center: c.center || "" };
  cfg.acctMap = Object.fromEntries(cfg.acct.filter(a => a.a).map(a => [a.a, a.i || ""]));

}
function classify(cfg, acct, memo, ovr) {

  if (!acct) return { item: "", why: "" };
  const t = String(memo || "").toLowerCase(); let hit = null;
  for (const r of cfg.rules) if (r.a === acct && r.p && t.includes(String(r.p).toLowerCase())) hit = r;

function groupOf(item) { return ITEM[item] ? ITEM[item].g : (item || ""); }
function parseNum(v) { if (v === "" || v == null) return 0; if (typeof v === "number") return isFinite(v) ? v : NaN; let t = String(v).trim().replace(/[,\s원₩]/g, "").replace(/[－−]/g, "-"); if (!t) return 0; let neg = false; if (/^\(.*\)$/.test(t)) { neg = true; t = t.slice(1, -1); } if (/^[△▲]/.test(t)) { neg = true; t = t.slice(1); } if (/-$/.test(t) && !/^-/.test(t)) { neg = true; t = t.slice(0, -1); } if (!/^[-+]?(\d+\.?\d*|\.\d+)(e[-+]?\d+)?$/i.test(t)) return NaN; const x = Number(t); return neg ? -Math.abs(x) : x; }
function num(v) { if (v === "" || v == null) return 0; const x = Number(String(v).replace(/[,\s원]/g, "")); return isFinite(x) ? x : 0; }
function hasVal(v) { return v !== "" && v != null && String(v).trim() !== ""; }
function budgetAmt(l) { return hasVal(l.direct) ? num(l.direct) : num(l.qty) * num(l.price); }
function ledgerAmt(l) { return num(l.dr) - num(l.cr); }
function ym(y, m) { return `${y}-${String(m).padStart(2, "0")}`; }
function ymParts(s) { return [Number(s.slice(0, 4)), Number(s.slice(5, 7))]; }
function ymAdd(s, n) { let [y, m] = ymParts(s); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return ym(y, m); }
function months(from, to) { const out = []; let c = from; let g = 0; while (c <= to && g++ < 400) { out.push(c); c = ymAdd(c, 1); } return out; }
function dueOf(s) { return ymAdd(s, -1) + "-15"; }

function buildAgg(cfg, B, L, A) {
  const bud = {}, act = {}, bst = {}, lst = {};
  const add = (o, k, it, v) => { (o[k] = o[k] || {}); o[k][it] = (o[k][it] || 0) + v; };
  for (const [k, doc] of Object.entries(B || {})) {
    const s = bst[k] = { n: 0, unc: 0, uncAmt: 0, exc: 0 };
    for (const l of (doc && doc.lines) || []) {
      if (!l.acct && !l.ovr) continue;
      const c = classify(cfg, l.acct, l.memo, l.ovr), v = budgetAmt(l);
      if (v !== 0) s.n++;
      if (c.item === "미분류") { s.unc++; s.uncAmt += v; } else if (c.item === "제외") s.exc += v;
      add(bud, k, c.item, v);
    }
  }
  for (const [k, doc] of Object.entries(L || {})) {
    const s = lst[k] = { n: 0, unc: 0, uncAmt: 0, exc: 0, total: 0 };
    for (const l of (doc && doc.lines) || []) {
      const c = classify(cfg, l.a, l.m, l.ovr), v = ledgerAmt(l);
      s.n++; s.total += v;
      if (c.item === "미분류") { s.unc++; s.uncAmt += v; } else if (c.item === "제외") s.exc += v;
      add(act, k, c.item, v);

  for (const [k, doc] of Object.entries(A || {})) for (const l of (doc && doc.lines) || []) if (l.item) add(act, k, l.item, num(l.amt));
  return { bud, act, bst, lst };
}
function sumRange(side, item, from, to) { let s = 0; for (const k of months(from, to)) s += (side[k] && side[k][item]) || 0; return s; }
function rowVals(leaf) {
  const v = {};
  const f = lb => {
    if (lb in v) return v[lb];
    const [, k, , args] = ROWMAP[lb]; let x;
    if (k === "leaf") x = leaf(lb);
    else if (k === "sum") x = args.reduce((s, a) => s + f(a), 0);
    else if (k === "diff") x = f(args[0]) - f(args[1]);
    else { const d = f(args[1]); x = d ? f(args[0]) / d : 0; }
    return (v[lb] = x);
  };
  ROWS.forEach(r => f(r[0]));

}
function rangeVals(side, rg) { return rowVals(it => sumRange(side, it, rg[0], rg[1])); }
function periods(type, y, k) {
  if (type === "M") { const c = ym(y, k), p = ymAdd(c, -1), yy = ym(y - 1, k); return { cur: [c, c], prev: [p, p], yoy: [yy, yy] }; }
  if (type === "Q") { const a = 3 * k - 2, b = 3 * k; const cur = [ym(y, a), ym(y, b)]; return { cur, prev: [ymAdd(cur[0], -3), ymAdd(cur[1], -3)], yoy: [ym(y - 1, a), ym(y - 1, b)] }; }
  return { cur: [ym(y, 1), ym(y, k)], yoy: [ym(y - 1, 1), ym(y - 1, k)], full: [ym(y, 1), ym(y, 12)], pfull: [ym(y - 1, 1), ym(y - 1, 12)] };
}
function flagOf(nat, b, a, thr) {
  if (nat === "X") return "";
  const d = a - b;
  if (b === 0 && a === 0) return "";
  const big = b !== 0 && Math.abs(d) >= thr.amt && Math.abs(d) / Math.abs(b) >= thr.rate;

const WQ = {};

function setConn(state, text) { const el = $("#conn"); el.className = "pill " + state; el.querySelector("span").textContent = text; }
function changed() { S.ver++; scheduleRender(); }
let renderPending = false, deferred = false;
function scheduleRender() {
  if (renderPending) return; renderPending = true;
  setTimeout(() => {
    renderPending = false;
    const a = document.activeElement;
    if (a && a.closest && a.closest(".main") && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && U.view !== "dashboard") { deferred = true; return; }
    render();
  }, 16);
}
document.addEventListener("focusout", () => { if (deferred) { deferred = false; setTimeout(scheduleRender, 0); } });

async function boot() {
  route();
  const c = window.claude;
  if (!c || !c.use) { setConn("off", (window.BDB_EXT && window.BDB_EXT.offText) || "공유 저장소 없음"); S.conn = "off"; render(); return; }

  db = d; user = u; sample = s; dls = w;
  if (user) { try { S.uid = await user.id(); S.isAdmin = await user.canEdit(); S.canWrite = await user.can("data.write"); } catch (e) {} }
  if (!db) { setConn("off", (window.BDB_EXT && window.BDB_EXT.offText) || "공유 저장소 없음"); S.conn = "off"; render(); return; }

  const timer = setTimeout(() => { if (S.conn !== "on") { setConn("wait", "응답 지연"); S.conn = "slow"; render(); } }, 10000);
  const seen = {}; const done = (key, snap) => { if (!snap.metadata.fromCache && !seen[key]) { seen[key] = 1; got++; if (got >= need) { clearTimeout(timer); S.conn = "on"; setConn("on", S.canWrite === false ? "읽기 전용" : "연결됨"); } } };
  const sub = (col, key) => db.collection(col).onSnapshot(snap => {
    S[key] = Object.fromEntries(snap.docs.map(x => [x.id, x.data()]));

  if (ai.t === "Q" && ai.k > 4) ai.k = Math.ceil(ai.k / 3);
  const ctx = aiContext(ai.t, ai.y, ai.k), saved = D().AI || {}, cur = saved[ctx.key];
  const list = Object.values(saved).sort((a, b) => String(b.at).localeCompare(String(a.at))).slice(0, 30);
  const can = !!sample && !S.demo && !ai.blocked, lock = ai.busy ? "disabled" : "";
  const mine = !!ai.out && ai.outKey === ctx.key;
  el.innerHTML = `
  <div class="vhead"><div><h2>AI 분석</h2><div class="sub-t">선택한 기간의 예산, 실적, 원장 적요, 차이사유를 Claude가 읽고 분석 보고를 씀. 실행할 때마다 보는 사람의 Claude 사용량이 쓰임</div></div>
    <div class="ctl"><span class="seg" role="group" aria-label="분석 단위">${[["M", "월"], ["Q", "분기"], ["Y", "연간 누계"]].map(([k, v]) => `<button data-t="${k}" aria-pressed="${ai.t === k}" ${lock}>${v}</button>`).join("")}</span>
    <label class="sr" for="aiY">연도</label><select id="aiY" ${lock}>${yearOptions(ai.y)}</select>
    <label class="sr" for="aiK">기간</label><select id="aiK" ${lock}>${ai.t === "Q" ? [1, 2, 3, 4].map(q => `<option value="${q}"${q === ai.k ? " selected" : ""}>${q}분기</option>`).join("") : mOptions(ai.k)}</select></div></div>
  ${S.demo ? `<div class="banner">예시 데이터에서는 AI 분석을 실행하지 않음. 실제 데이터를 입력한 뒤 사용함</div>` : !sample ? `<div class="banner">${esc((window.BDB_EXT && window.BDB_EXT.aiMissing) || "이 화면에서는 AI를 쓸 수 없음. claude.ai에서 이 페이지를 열어야 함")}</div>` : ai.blocked ? `<div class="banner">${esc(ai.blockMsg || "이 화면에서는 AI 사용이 허용되지 않음")}</div>` : ""}
  <div class="grid2" style="grid-template-columns:minmax(0,2.2fr) minmax(0,1fr)">
    <div class="panel">
      <div class="panel-h"><span class="cap">${esc(ctx.label)} 분석 보고</span><span class="toolbar">
        <button class="btn pri" id="aiRun" ${can && !ai.busy ? "" : "disabled"}>${cur ? "다시 분석" : "AI 분석 실행"}</button>
        <button class="btn" id="aiStop" ${ai.busy ? "" : "disabled"}>중지</button>
        <button class="btn" id="aiSave" ${!ai.busy && mine && !ai.partial && writable() ? "" : "disabled"}>분석 저장(공유)</button></span></div>
      <div class="ai-out" id="aiOut">${ai.busy && ai.outKey === ctx.key ? (ai.out ? md(ai.out) : `<p class="thinking">분석 중. 데이터를 읽고 있음 (보통 20초~1분)</p>`) : mine ? md(ai.out) + (ai.partial ? `<p class="muted">(중단된 답변이라 저장하지 않음)</p>` : "") : cur ? md(cur.text) : `<div class="empty">아직 분석이 없음. 'AI 분석 실행'을 누름</div>`}</div>
      ${cur && !mine ? `<span class="src">저장된 분석: ${who(cur.by)} ${when(cur.at)}</span>` : ""}
      <span class="note" id="aiNote">${esc(ai.note || "")}</span>
    </div>
    <div class="panel"><span class="cap">저장된 분석</span>
      ${list.length ? `<div class="list">${list.map(s => `<button data-k="${esc(s.key)}" ${lock}><b>${esc(s.label || s.key)}</b><br><span class="src">${who(s.by)} ${when(s.at)}</span></button>`).join("")}</div>` : `<div class="empty">저장된 분석 없음</div>`}
    </div>
  </div>
  <div class="panel"><div class="panel-h"><span class="cap">AI에게 질문</span><span class="src">${esc(ctx.label)} 데이터를 근거로 답함</span></div>
    <div class="chat" id="chat">${ai.chat.length ? ai.chat.map(m => `<div class="msg ${m.role === "user" ? "me" : "ai"}"${m.pending ? ' data-pending="1"' : ""}>${m.role === "user" ? esc(m.content) : (m.pending && !m.content) ? `<p class="thinking">생각 중</p>` : `<div class="ai-out">${md(m.content)}</div>${m.failed ? `<p class="muted">(중단된 답변)</p>` : ""}`}</div>`).join("") : `<div class="note">예: '광고선전비가 예산보다 많이 나간 이유를 원장에서 찾아줘', '다음 달 강사료 예산은 얼마로 잡는 게 좋을까'</div>`}</div>
    <span class="note">${esc(ai.chatNote || "")}</span>
    <form class="row-in" id="chatForm"><label class="sr" for="chatIn">질문</label><input type="text" id="chatIn" placeholder="질문 입력" ${can && !ai.chatBusy ? "" : "disabled"} autocomplete="off"><button class="btn pri" ${can && !ai.chatBusy ? "" : "disabled"}>보내기</button>${ai.chatBusy ? `<button class="btn" type="button" id="chatStop">중지</button>` : ""}${ai.chat.length ? `<button class="btn" type="button" id="chatClr" ${ai.chatBusy ? "disabled" : ""}>대화 지우기</button>` : ""}</form>
  </div>`;
  el.querySelectorAll(".seg button[data-t]").forEach(b => b.onclick = () => { if (ai.busy) return; const nt = b.dataset.t; ai.k = nt === "Q" ? Math.ceil((ai.t === "Q" ? ai.k * 3 : ai.k) / 3) : (ai.t === "Q" ? ai.k * 3 : ai.k); ai.t = nt; ai.note = ""; render(); });
  $("#aiY").onchange = e => { if (ai.busy) return; ai.y = Number(e.target.value); ai.note = ""; render(); };
  $("#aiK").onchange = e => { if (ai.busy) return; ai.k = Number(e.target.value); ai.note = ""; render(); };
  el.querySelectorAll(".list button[data-k]").forEach(b => b.onclick = () => { if (ai.busy) return; const s = saved[b.dataset.k]; const m = String(s.key).match(/^([MQY])-(\d{4})-(?:(\d{2})$|Q(\d)$|1~(\d+)$)/); if (m) { ai.t = m[1]; ai.y = Number(m[2]); ai.k = Number(m[3] || m[4] || m[5]); ai.out = ""; ai.outKey = null; render(); } });
  $("#aiRun").onclick = async () => {
    if (!can || ai.busy) return;
    ai.busy = true; ai.out = ""; ai.outKey = ctx.key; ai.note = ""; ai.partial = false; ai.ctl = new AbortController(); render();
    try {
      const { text, truncated } = await sample(`${AI_RULES}\n\n[데이터]\n${ctx.text}`, { signal: ai.ctl.signal, cache: false, onText: ({ text }) => { ai.out = text; const o = $("#aiOut"); if (o && U.view === "ai") o.innerHTML = md(text); } });
      ai.out = text; if (truncated) { ai.partial = true; ai.note = "답이 길어 중간에 잘림. 기간을 줄여 다시 실행함"; }
    } catch (e) {
      ai.out = (e && e.text) || ""; ai.partial = true; ai.note = e && e.code === "cancelled" ? "중지함" : aiErr(e);
      if (e && AI_PERM.includes(e.code)) { ai.blocked = true; ai.blockMsg = aiErr(e); }
    } finally { ai.busy = false; render(); }
  };
  $("#aiStop").onclick = () => ai.ctl && ai.ctl.abort();
  $("#aiSave").onclick = async () => { if (!writable() || ai.busy || ai.partial || !mine) return; const ref = db.doc("ai/" + ctx.key); try { await queueWrite(ref.path, () => ref.set({ key: ctx.key, label: ctx.label, text: ai.out, by: S.uid || null, at: new Date().toISOString() })); toast("분석을 저장함. 대시보드와 다른 사람 화면에서도 보임"); ai.out = ""; ai.outKey = null; render(); } catch (e) { toast(dbErr(e)); } };
  $("#chatForm").onsubmit = async ev => {
    ev.preventDefault(); if (!can || ai.chatBusy) return; const q = $("#chatIn").value.trim(); if (!q) return;
    const reply = { role: "assistant", content: "", pending: true };
    ai.chat.push({ role: "user", content: q }, reply); ai.chatBusy = true; ai.chatNote = ""; ai.chatCtl = new AbortController(); render();
    const hist = ai.chat.filter(m => !m.pending && !m.failed).slice(-10);
    const turns = [{ role: "user", content: `${AI_RULES.split("\n")[0]}\n질문에 답할 때는 아래 [데이터]만 근거로 하고, 개조식 '~함'으로 짧게 답함. 데이터에 없으면 '데이터에 없음'이라고 답함.\n\n[데이터]\n${ctx.text}` }, ...hist];
    try {
      const { text } = await sample(turns, { cache: false, signal: ai.chatCtl.signal, onText: ({ text }) => { reply.content = text; const node = document.querySelector('#chat [data-pending="1"]'); if (node && U.view === "ai") node.innerHTML = `<div class="ai-out">${md(text)}</div>`; } });
      reply.content = text; delete reply.pending;
    } catch (e) {
      delete reply.pending; if (reply.content) reply.failed = true; else { const i = ai.chat.indexOf(reply); if (i >= 0) ai.chat.splice(i, 1); }
      ai.chatNote = e && e.code === "cancelled" ? "중지함" : aiErr(e);
      if (e && AI_PERM.includes(e.code)) { ai.blocked = true; ai.blockMsg = aiErr(e); }
    } finally { ai.chatBusy = false; render(); const ci = $("#chatIn"); if (ci && !ci.disabled) ci.focus(); }
  };
  if ($("#chatStop")) $("#chatStop").onclick = () => ai.chatCtl && ai.chatCtl.abort();
  if ($("#chatClr")) $("#chatClr").onclick = () => { if (ai.chatBusy) return; ai.chat = []; ai.chatNote = ""; render(); };
}

// ===== 기준정보 =====
const RLB = { a: "더존 계정", p: "적요 포함 문구", i: "실적표 항목", note: "비고", "0": "더존 계정", "1": "표준 적요" };
function renderRules(el) {
  const c = S.cfg, ed = U.rulesEdit, admin = S.isAdmin && db && !S.demo;
  const src = ed || { acct: clone(c.acct), rules: clone(c.rules), std: clone(c.std), thr: clone(c.thr), center: c.center };
  const inp = (k, i, f, v, w) => ed ? `<input type="text" data-k="${k}" data-i="${i}" data-f="${f}" value="${esc(v)}" style="width:${w || "100%"}" aria-label="${RLB[f] || f}">` : esc(v);

  <div class="vhead"><div><h2>기준정보</h2><div class="sub-t">예산과 실적에 똑같이 쓰는 분류 규칙. 엑셀 시스템의 '기준정보' 시트와 같은 내용으로 시작함 ${S.cfgSaved ? "" : "(아직 저장 전, 기본값 사용 중)"}</div></div>
    <div class="ctl">${admin ? (ed ? `<button class="btn" id="rCancel">취소</button><button class="btn pri" id="rSave">저장</button>` : `<button class="btn pri" id="rEdit">수정</button>`) : `<span class="note">수정은 편집자 권한이 있는 사람만 가능함</span>`}</div></div>
  <div class="panel"><span class="cap">1 실적표 항목과 구분 (33개)</span>
    <div class="tbl"><table><thead><tr><th>실적표 항목</th><th>구분</th><th>실적표 위치</th></tr></thead><tbody>${ITEMS.map(i => `<tr><td>${esc(i.n)}</td><td>${chip(i.g)}</td><td>${esc(i.big === "매출액" ? "매출액" : i.big === "이익조정" ? "이익조정(배분)" : "판매비와 일반관리비 > " + i.big + (i.mid ? " > " + i.mid : ""))}</td></tr>`).join("")}</tbody></table></div>
    <div class="note">항목 체계는 실적표 양식과 맞물려 있어 이 화면에서 바꾸지 않음</div></div>
  <div class="grid2">
    <div class="panel"><span class="cap">2 더존 계정 기본 매핑 (${src.acct.length}개)</span>
      <div class="tbl tall"><table><thead><tr><th>더존 계정</th><th>기본 실적표 항목</th><th>구분</th><th>비고</th>${ed ? "<th></th>" : ""}</tr></thead><tbody>${src.acct.map((a, i) => `<tr><td>${inp("acct", i, "a", a.a)}</td><td>${isel("acct", i, "i", a.i)}</td><td>${chip(a.i ? groupOf(a.i) : "")}</td><td class="wrap">${inp("acct", i, "note", a.note || "")}</td>${ed ? `<td><button class="btn sm" data-del="acct" data-i="${i}">삭제</button></td>` : ""}</tr>`).join("")}</tbody></table></div>
      ${ed ? `<button class="btn" data-add="acct">계정 추가</button>` : ""}</div>
    <div class="panel"><span class="cap">3 적요 문구 규칙 (${src.rules.length}개, 아래쪽 규칙 우선)</span><span class="note">문구는 글자 그대로 찾음. 엑셀처럼 * ? ~ 를 와일드카드로 쓰지 않음</span>
      <div class="tbl tall"><table><thead><tr><th>더존 계정</th><th>적요 포함 문구</th><th>실적표 항목</th>${ed ? "<th></th>" : ""}</tr></thead><tbody>${src.rules.map((r, i) => `<tr><td>${inp("rules", i, "a", r.a)}</td><td>${inp("rules", i, "p", r.p)}</td><td>${isel("rules", i, "i", r.i)}</td>${ed ? `<td><button class="btn sm" data-del="rules" data-i="${i}">삭제</button></td>` : ""}</tr>`).join("")}</tbody></table></div>
      ${ed ? `<button class="btn" data-add="rules">규칙 추가</button>` : ""}</div>
  </div>
  <div class="grid2">
    <div class="panel"><span class="cap">4 표준 적요 (${src.std.length}줄, 예산 입력 목록과 기본 목록에 쓰임)</span>
      <div class="tbl tall"><table><thead><tr><th>더존 계정</th><th>표준 적요</th><th>들어가는 항목</th>${ed ? "<th></th>" : ""}</tr></thead><tbody>${src.std.map((s, i) => `<tr><td>${inp("std", i, "0", s[0])}</td><td>${inp("std", i, "1", s[1])}</td><td>${esc(classify(c, s[0], s[1], "").item)}</td>${ed ? `<td><button class="btn sm" data-del="std" data-i="${i}">삭제</button></td>` : ""}</tr>`).join("")}</tbody></table></div>
      ${ed ? `<button class="btn" data-add="std">적요 추가</button>` : ""}</div>
    <div class="panel"><span class="cap">5 점검 기준</span>
      <div class="tbl"><table><tbody>
        <tr><td>차이 금액 기준(원)</td><td class="num">${ed ? `<input type="number" id="thrAmt" value="${esc(src.thr.amt)}">` : nf.format(src.thr.amt)}</td></tr>
        <tr><td>차이율 기준(%)</td><td class="num">${ed ? `<input type="number" id="thrRate" value="${esc(Math.round(src.thr.rate * 100))}">` : Math.round(src.thr.rate * 100) + "%"}</td></tr>
        <tr><td>더존 비용센터</td><td>${ed ? `<input type="text" id="cfgCenter" value="${esc(src.center)}">` : esc(src.center)}</td></tr>
      </tbody></table></div>
      <div class="note">차이 금액과 차이율 기준을 모두 넘으면 분석 화면 점검란에 표시함. 비용센터가 다른 원장 행은 올릴 때 뺄 수 있음</div></div>

  if (window.BDB_EXT && window.BDB_EXT.bindRules) window.BDB_EXT.bindRules(el, { render, toast, esc, cfgEmpty: !S.cfg.acct.length });
  if (!admin) return;
  if ($("#rEdit")) $("#rEdit").onclick = () => { U.rulesEdit = { acct: clone(c.acct), rules: clone(c.rules), std: clone(c.std), thr: clone(c.thr), center: c.center }; render(); };
  if (!ed) return;
  $("#rCancel").onclick = () => { U.rulesEdit = null; render(); };

  el.onchange = e => { const t = e.target; if (t.dataset.k && t.tagName === "SELECT") { ed[t.dataset.k][Number(t.dataset.i)][t.dataset.f] = t.value; } };
  el.querySelectorAll("[data-del]").forEach(b => b.onclick = () => { ed[b.dataset.del].splice(Number(b.dataset.i), 1); render(); });
  el.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { const k = b.dataset.add; ed[k].push(k === "acct" ? { a: "", i: "", note: "" } : k === "rules" ? { a: "", p: "", i: "" } : ["", ""]); render(); });
  $("#rSave").onclick = async () => {
    if (S.demo || !db) return;
    const body = { acct: ed.acct.filter(a => a.a), rules: ed.rules.filter(r => r.a && r.p && r.i), std: ed.std.filter(s => s[0] && s[1]), thr: (() => { const ta = $("#thrAmt").value.trim(), tr = $("#thrRate").value.trim(); return { amt: ta !== "" && isFinite(Number(ta)) && Number(ta) >= 0 ? Number(ta) : 500000, rate: tr !== "" && isFinite(Number(tr)) && Number(tr) >= 0 ? Number(tr) / 100 : 0.1 }; })(), center: $("#cfgCenter").value.trim(), updatedBy: S.uid || null, updatedAt: new Date().toISOString() };
    const ref = db.doc("config/main");
    try { await queueWrite(ref.path, () => ref.set(body)); U.rulesEdit = null; toast("기준정보를 저장함. 예산과 실적 분류에 바로 반영됨"); render(); } catch (e) { toast(dbErr(e)); }
  };
}

// ===== 엑셀 내보내기 =====
let DLS_OFF = false;
function canExport() { return !!window.XLSX && !!dls && !DLS_OFF; }
async function saveXlsx(wb, name) {
  if (!window.XLSX) { toast("엑셀 도구를 불러오지 못함"); return; }
  if (!dls || DLS_OFF) { toast("이 화면에서는 파일을 내려받을 수 없음"); return; }
  if (S.demo) name = "예시_" + name;
  try { const buf = XLSX.write(wb, { type: "array", bookType: "xlsx" }); await dls.save({ filename: name + ".xlsx", data: new Blob([buf]) }); }
  catch (e) {
    const c = e && e.code;
    if (c === "declined") return;
    if (c === "extension_not_enabled") { toast("이 화면에서는 엑셀 파일 저장이 허용되지 않음"); return; }
    if (c === "rate_limited") { toast("저장 창이 이미 열려 있음. 잠시 뒤 다시 누름"); return; }
    if (["unavailable", "not_granted", "capability_disabled", "capability_removed"].includes(c)) { DLS_OFF = true; toast("이 화면에서는 파일을 내려받을 수 없음"); render(); return; }
    toast("파일을 저장하지 못함");
  }
}
function exportBudget(bd) {
  if (!window.XLSX) { toast("엑셀 도구를 불러오지 못함"); return; }
  const rows = [["연월", "더존 계정", "적요", "구분", "실적표 항목", "수량", "단가", "직접입력 금액", "예산금액", "산출근거", "항목 직접지정"]];
  bd.lines.forEach(l => { const c = classify(S.cfg, l.acct, l.memo, l.ovr); rows.push([bd.ym, l.acct, l.memo, groupOf(c.item), c.item, hasVal(l.qty) ? num(l.qty) : "", hasVal(l.price) ? num(l.price) : "", hasVal(l.direct) ? num(l.direct) : "", budgetAmt(l), l.basis || "", l.ovr || ""]); });
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), "예산입력"); saveXlsx(wb, `부산대성_예산_${bd.ym}`);
}
function exportReport(y, a, b, p, tA, tB, tP) {
  if (!window.XLSX) { toast("엑셀 도구를 불러오지 못함"); return; }
  const wb = XLSX.utils.book_new();
  const mk = (arr, tot, name) => { const rows = [[`${name}(부산재수)`, ...Array.from({ length: 12 }, (_, i) => `${i + 1}월`), "계"]]; ROWS.forEach(([lb, kind]) => rows.push(["  ".repeat(ROWMAP[lb][2]) + lb, ...arr.map(v => kind === "ratio" ? Number(v[lb].toFixed(4)) : Math.round(v[lb])), kind === "ratio" ? Number(tot[lb].toFixed(4)) : Math.round(tot[lb])])); return XLSX.utils.aoa_to_sheet(rows); };

}
function exportAnalysis(table, name) {

  rows.unshift([`단위: ${UNIT_LB()} (비율은 소수)`]);
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(rows), "분석"); saveXlsx(wb, `부산대성_${name.replace(/[^\w가-힣~-]/g, "_")}`);
}
